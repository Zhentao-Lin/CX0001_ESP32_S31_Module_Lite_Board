///////////////////////////////////////////////
/* PCB rendering code */

var emptyContext2d = document.createElement("canvas").getContext("2d");

function deg2rad(deg) {
  return deg * Math.PI / 180;
}

function calcFontPoint(linepoint, text, offsetx, offsety, tilt) {
  var point = [
    linepoint[0] * text.width + offsetx,
    linepoint[1] * text.height + offsety
  ];
  // This approximates pcbnew behavior with how text tilts depending on horizontal justification
  point[0] -= (linepoint[1] + 0.5 * (1 + text.justify[0])) * text.height * tilt;
  return point;
}

function drawText(ctx, text, color) {
  if ("ref" in text && !settings.renderReferences) return;
  if ("val" in text && !settings.renderValues) return;
  ctx.save();
  ctx.fillStyle = color;
  ctx.strokeStyle = color;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.lineWidth = text.thickness;
  if ("svgpath" in text) {
    ctx.stroke(new Path2D(text.svgpath));
    ctx.restore();
    return;
  }
  ctx.translate(...text.pos);
  ctx.translate(text.thickness * 0.5, 0);
  var angle = -text.angle;
  if (text.attr.includes("mirrored")) {
    ctx.scale(-1, 1);
    angle = -angle;
  }
  var tilt = 0;
  if (text.attr.includes("italic")) {
    tilt = 0.125;
  }
  var interline = text.height * 1.5 + text.thickness;
  // Normalize Windows/Mac newlines so leftover "\r" does not crash glyph lookup
  var txt = String(text.text || "").replace(/\r\n/g, "\n").replace(/\r/g, "\n").split("\n");
  // KiCad ignores last empty line.
  if (txt[txt.length - 1] == '') txt.pop();
  ctx.rotate(deg2rad(angle));
  var offsety = (1 - text.justify[1]) / 2 * text.height; // One line offset
  offsety -= (txt.length - 1) * (text.justify[1] + 1) / 2 * interline; // Multiline offset
  var spaceGlyph = (pcbdata.font_data && pcbdata.font_data[' ']) || { w: 0.5, l: [] };
  function glyphFor(ch) {
    if (!ch || ch.charCodeAt(0) < 32) return spaceGlyph;
    var g = pcbdata.font_data && pcbdata.font_data[ch];
    if (g && g.w != null) return g;
    return (pcbdata.font_data && pcbdata.font_data['?']) || spaceGlyph;
  }
  for (var i in txt) {
    var lineWidth = text.thickness + interline / 2 * tilt;
    for (var j = 0; j < txt[i].length; j++) {
      if (txt[i][j] == '\t') {
        var fourSpaces = 4 * spaceGlyph.w * text.width;
        lineWidth += fourSpaces - lineWidth % fourSpaces;
      } else {
        if (txt[i][j] == '~') {
          j++;
          if (j == txt[i].length)
            break;
        }
        lineWidth += glyphFor(txt[i][j]).w * text.width;
      }
    }
    var offsetx = -lineWidth * (text.justify[0] + 1) / 2;
    var inOverbar = false;
    for (var j = 0; j < txt[i].length; j++) {
      if (txt[i][j] == '\t') {
        var fourSpaces = 4 * spaceGlyph.w * text.width;
        offsetx += fourSpaces - offsetx % fourSpaces;
        continue;
      } else if (txt[i][j] == '~') {
        j++;
        if (j == txt[i].length)
          break;
        if (txt[i][j] != '~') {
          inOverbar = !inOverbar;
        }
      }
      var glyph = glyphFor(txt[i][j]);
      if (inOverbar) {
        var overbarStart = [offsetx, -text.height * 1.4 + offsety];
        var overbarEnd = [offsetx + text.width * glyph.w, overbarStart[1]];

        if (!lastHadOverbar) {
          overbarStart[0] += text.height * 1.4 * tilt;
          lastHadOverbar = true;
        }
        ctx.beginPath();
        ctx.moveTo(...overbarStart);
        ctx.lineTo(...overbarEnd);
        ctx.stroke();
      } else {
        lastHadOverbar = false;
      }
      for (var line of (glyph.l || [])) {
        ctx.beginPath();
        ctx.moveTo(...calcFontPoint(line[0], text, offsetx, offsety, tilt));
        for (var k = 1; k < line.length; k++) {
          ctx.lineTo(...calcFontPoint(line[k], text, offsetx, offsety, tilt));
        }
        ctx.stroke();
      }
      offsetx += glyph.w * text.width;
    }
    offsety += interline;
  }
  ctx.restore();
}

function drawedge(ctx, scalefactor, edge, color) {
  ctx.strokeStyle = color;
  ctx.lineWidth = Math.max(1 / scalefactor, edge.width);
  ctx.lineCap = "round";
  if ("svgpath" in edge) {
    ctx.stroke(new Path2D(edge.svgpath));
  } else {
    ctx.beginPath();
    if (edge.type == "segment") {
      ctx.moveTo(...edge.start);
      ctx.lineTo(...edge.end);
    }
    if (edge.type == "rect") {
      ctx.moveTo(...edge.start);
      ctx.lineTo(edge.start[0], edge.end[1]);
      ctx.lineTo(...edge.end);
      ctx.lineTo(edge.end[0], edge.start[1]);
      ctx.lineTo(...edge.start);
    }
    if (edge.type == "arc") {
      ctx.arc(
        ...edge.start,
        edge.radius,
        deg2rad(edge.startangle),
        deg2rad(edge.endangle));
    }
    if (edge.type == "circle") {
      ctx.arc(
        ...edge.start,
        edge.radius,
        0, 2 * Math.PI);
      ctx.closePath();
    }
    if (edge.type == "curve") {
      ctx.moveTo(...edge.start);
      ctx.bezierCurveTo(...edge.cpa, ...edge.cpb, ...edge.end);
    }
    ctx.stroke();
  }
}

function getChamferedRectPath(size, radius, chamfpos, chamfratio) {
  // chamfpos is a bitmask, left = 1, right = 2, bottom left = 4, bottom right = 8
  var path = new Path2D();
  var width = size[0];
  var height = size[1];
  var x = width * -0.5;
  var y = height * -0.5;
  var chamfOffset = Math.min(width, height) * chamfratio;
  path.moveTo(x, 0);
  if (chamfpos & 4) {
    path.lineTo(x, y + height - chamfOffset);
    path.lineTo(x + chamfOffset, y + height);
    path.lineTo(0, y + height);
  } else {
    path.arcTo(x, y + height, x + width, y + height, radius);
  }
  if (chamfpos & 8) {
    path.lineTo(x + width - chamfOffset, y + height);
    path.lineTo(x + width, y + height - chamfOffset);
    path.lineTo(x + width, 0);
  } else {
    path.arcTo(x + width, y + height, x + width, y, radius);
  }
  if (chamfpos & 2) {
    path.lineTo(x + width, y + chamfOffset);
    path.lineTo(x + width - chamfOffset, y);
    path.lineTo(0, y);
  } else {
    path.arcTo(x + width, y, x, y, radius);
  }
  if (chamfpos & 1) {
    path.lineTo(x + chamfOffset, y);
    path.lineTo(x, y + chamfOffset);
    path.lineTo(x, 0);
  } else {
    path.arcTo(x, y, x, y + height, radius);
  }
  path.closePath();
  return path;
}

function getOblongPath(size) {
  return getChamferedRectPath(size, Math.min(size[0], size[1]) / 2, 0, 0);
}

function getPolygonsPath(shape) {
  if (shape.path2d) {
    return shape.path2d;
  }
  if ("svgpath" in shape) {
    shape.path2d = new Path2D(shape.svgpath);
  } else {
    var path = new Path2D();
    for (var polygon of shape.polygons) {
      path.moveTo(...polygon[0]);
      for (var i = 1; i < polygon.length; i++) {
        path.lineTo(...polygon[i]);
      }
      path.closePath();
    }
    shape.path2d = path;
  }
  return shape.path2d;
}

function drawPolygonShape(ctx, shape, color) {
  ctx.save();
  ctx.fillStyle = color;
  if (!("svgpath" in shape)) {
    ctx.translate(...shape.pos);
    ctx.rotate(deg2rad(-shape.angle));
  }
  ctx.fill(getPolygonsPath(shape));
  ctx.restore();
}

function drawDrawing(ctx, scalefactor, drawing, color) {
  if (["segment", "arc", "circle", "curve"].includes(drawing.type)) {
    drawedge(ctx, scalefactor, drawing, color);
  } else if (drawing.type == "polygon") {
    drawPolygonShape(ctx, drawing, color);
  } else {
    drawText(ctx, drawing, color);
  }
}

function getCirclePath(radius) {
  var path = new Path2D();
  path.arc(0, 0, radius, 0, 2 * Math.PI);
  path.closePath();
  return path;
}

function getCachedPadPath(pad) {
  if (!pad.path2d) {
    // if path2d is not set, build one and cache it on pad object
    if (pad.shape == "rect") {
      pad.path2d = new Path2D();
      pad.path2d.rect(...pad.size.map(c => -c * 0.5), ...pad.size);
    } else if (pad.shape == "oval") {
      pad.path2d = getOblongPath(pad.size);
    } else if (pad.shape == "circle") {
      pad.path2d = getCirclePath(pad.size[0] / 2);
    } else if (pad.shape == "roundrect") {
      pad.path2d = getChamferedRectPath(pad.size, pad.radius, 0, 0);
    } else if (pad.shape == "chamfrect") {
      pad.path2d = getChamferedRectPath(pad.size, pad.radius, pad.chamfpos, pad.chamfratio)
    } else if (pad.shape == "custom") {
      pad.path2d = getPolygonsPath(pad);
    }
  }
  return pad.path2d;
}

function drawPad(ctx, pad, color, outline) {
  ctx.save();
  ctx.translate(...pad.pos);
  ctx.rotate(deg2rad(pad.angle));
  if (pad.offset) {
    ctx.translate(...pad.offset);
  }
  ctx.fillStyle = color;
  ctx.strokeStyle = color;
  var path = getCachedPadPath(pad);
  if (outline) {
    ctx.stroke(path);
  } else {
    ctx.fill(path);
  }
  ctx.restore();
}

function drawPadHole(ctx, pad, padHoleColor) {
  if (pad.type != "th") return;
  ctx.save();
  ctx.translate(...pad.pos);
  ctx.rotate(deg2rad(pad.angle));
  ctx.fillStyle = padHoleColor;
  if (pad.drillshape == "oblong") {
    ctx.fill(getOblongPath(pad.drillsize));
  } else {
    ctx.fill(getCirclePath(pad.drillsize[0] / 2));
  }
  ctx.restore();
}

function drawFootprint(ctx, layer, scalefactor, footprint, padColor, padHoleColor, outlineColor, highlight, outline) {
  if (highlight) {
    // draw bounding box
    if (footprint.layer == layer) {
      ctx.save();
      ctx.globalAlpha = 0.2;
      ctx.translate(...footprint.bbox.pos);
      ctx.rotate(deg2rad(-footprint.bbox.angle));
      ctx.translate(...footprint.bbox.relpos);
      ctx.fillStyle = padColor;
      ctx.fillRect(0, 0, ...footprint.bbox.size);
      ctx.globalAlpha = 1;
      ctx.strokeStyle = padColor;
      ctx.strokeRect(0, 0, ...footprint.bbox.size);
      ctx.restore();
    }
  }
  // draw drawings
  for (var drawing of footprint.drawings) {
    if (drawing.layer == layer) {
      drawDrawing(ctx, scalefactor, drawing.drawing, padColor);
    }
  }
  // draw pads
  if (settings.renderPads) {
    for (var pad of footprint.pads) {
      if (pad.layers.includes(layer)) {
        drawPad(ctx, pad, padColor, outline);
        if (pad.pin1 && settings.highlightpin1) {
          drawPad(ctx, pad, outlineColor, true);
        }
      }
    }
    for (var pad of footprint.pads) {
      drawPadHole(ctx, pad, padHoleColor);
    }
  }
}

function drawEdgeCuts(canvas, scalefactor) {
  var ctx = canvas.getContext("2d");
  var edgecolor = getComputedStyle(topmostdiv).getPropertyValue('--pcb-edge-color');
  for (var edge of pcbdata.edges) {
    drawedge(ctx, scalefactor, edge, edgecolor);
  }
}

function drawFootprints(canvas, layer, scalefactor, highlight) {
  var ctx = canvas.getContext("2d");
  ctx.lineWidth = 3 / scalefactor;
  var style = getComputedStyle(topmostdiv);
  var padColor = style.getPropertyValue('--pad-color');
  var padHoleColor = style.getPropertyValue('--pad-hole-color');
  var outlineColor = style.getPropertyValue('--pin1-outline-color');
  if (highlight) {
    padColor = style.getPropertyValue('--pad-color-highlight');
    outlineColor = style.getPropertyValue('--pin1-outline-color-highlight');
  }
  for (var i = 0; i < pcbdata.footprints.length; i++) {
    var mod = pcbdata.footprints[i];
    var outline = settings.renderDnpOutline && pcbdata.bom.skipped.includes(i);
    if (!highlight || highlightedFootprints.includes(i)) {
      drawFootprint(ctx, layer, scalefactor, mod, padColor, padHoleColor, outlineColor, highlight, outline);
    }
  }
}

function drawBgLayer(layername, canvas, layer, scalefactor, edgeColor, polygonColor, textColor) {
  var ctx = canvas.getContext("2d");
  for (var d of pcbdata[layername][layer]) {
    if (["segment", "arc", "circle", "curve", "rect"].includes(d.type)) {
      drawedge(ctx, scalefactor, d, edgeColor);
    } else if (d.type == "polygon") {
      drawPolygonShape(ctx, d, polygonColor);
    } else {
      drawText(ctx, d, textColor);
    }
  }
}

function drawTracks(canvas, layer, color, highlight) {
  ctx = canvas.getContext("2d");
  ctx.strokeStyle = color;
  ctx.lineCap = "round";
  for(var track of pcbdata.tracks[layer]) {
    if (highlight && highlightedNet != track.net) continue;
    ctx.lineWidth = track.width;
    ctx.beginPath();
    ctx.moveTo(...track.start);
    ctx.lineTo(...track.end);
    ctx.stroke();
  }
}

function drawZones(canvas, layer, color, highlight) {
  ctx = canvas.getContext("2d");
  ctx.strokeStyle = color;
  ctx.fillStyle = color;
  ctx.lineJoin = "round";
  for(var zone of pcbdata.zones[layer]) {
    if (!zone.path2d) {
      zone.path2d = getPolygonsPath(zone);
    }
    if (highlight && highlightedNet != zone.net) continue;
    ctx.fill(zone.path2d);
    if (zone.width > 0) {
      ctx.lineWidth = zone.width;
      ctx.stroke(zone.path2d);
    }
  }
}

function clearCanvas(canvas, color = null) {
  var ctx = canvas.getContext("2d");
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (color) {
    ctx.fillStyle = color;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  } else {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
  ctx.restore();
}

function drawNets(canvas, layer, highlight) {
  var style = getComputedStyle(topmostdiv);
  if (settings.renderTracks) {
    var trackColor = style.getPropertyValue(highlight ? '--track-color-highlight' : '--track-color');
    drawTracks(canvas, layer, trackColor, highlight);
  }
  if (settings.renderZones) {
    var zoneColor = style.getPropertyValue(highlight ? '--zone-color-highlight' : '--zone-color');
    drawZones(canvas, layer, zoneColor, highlight);
  }
  if (highlight && settings.renderPads) {
    var padColor = style.getPropertyValue('--pad-color-highlight');
    var padHoleColor = style.getPropertyValue('--pad-hole-color');
    var ctx = canvas.getContext("2d");
    for (var footprint of pcbdata.footprints) {
      // draw pads
      var padDrawn = false;
      for (var pad of footprint.pads) {
        if (highlightedNet != pad.net) continue;
        if (pad.layers.includes(layer)) {
          drawPad(ctx, pad, padColor, false);
          padDrawn = true;
        }
      }
      if (padDrawn) {
        // redraw all pad holes because some pads may overlap
        for (var pad of footprint.pads) {
          drawPadHole(ctx, pad, padHoleColor);
        }
      }
    }
  }
}

function drawHighlightsOnLayer(canvasdict, clear = true) {
  if (clear) {
    clearCanvas(canvasdict.highlight);
  }
  if (highlightedFootprints.length > 0) {
    drawFootprints(canvasdict.highlight, canvasdict.layer,
      canvasdict.transform.s * canvasdict.transform.zoom, true);
  }
  if (highlightedNet !== null) {
    drawNets(canvasdict.highlight, canvasdict.layer, true);
  }
}

function drawHighlights() {
  drawHighlightsOnLayer(allcanvas.front);
  drawHighlightsOnLayer(allcanvas.back);
}

function drawBackground(canvasdict, clear = true) {
  if (clear) {
    clearCanvas(canvasdict.bg);
    clearCanvas(canvasdict.fab);
    clearCanvas(canvasdict.silk);
  }

  drawNets(canvasdict.bg, canvasdict.layer, false);
  drawFootprints(canvasdict.bg, canvasdict.layer,
    canvasdict.transform.s * canvasdict.transform.zoom, false);

  drawEdgeCuts(canvasdict.bg, canvasdict.transform.s);

  var style = getComputedStyle(topmostdiv);
  var edgeColor = style.getPropertyValue('--silkscreen-edge-color');
  var polygonColor = style.getPropertyValue('--silkscreen-polygon-color');
  var textColor = style.getPropertyValue('--silkscreen-text-color');
  if (settings.renderSilkscreen) {
    drawBgLayer(
      "silkscreen", canvasdict.silk, canvasdict.layer,
      canvasdict.transform.s * canvasdict.transform.zoom,
      edgeColor, polygonColor, textColor);
  }
  edgeColor = style.getPropertyValue('--fabrication-edge-color');
  polygonColor = style.getPropertyValue('--fabrication-polygon-color');
  textColor = style.getPropertyValue('--fabrication-text-color');
  if (settings.renderFabrication) {
    drawBgLayer(
      "fabrication", canvasdict.fab, canvasdict.layer,
      canvasdict.transform.s * canvasdict.transform.zoom,
      edgeColor, polygonColor, textColor);
  }
  // Board size labels live on fab so highlight clear does not erase them
  if (typeof drawPcbDimensions === "function") {
    drawPcbDimensions(canvasdict);
  }
}

function prepareCanvas(canvas, flip, transform) {
  var ctx = canvas.getContext("2d");
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  var fontsize = 1.55;
  ctx.scale(transform.zoom, transform.zoom);
  ctx.translate(transform.panx, transform.pany);
  if (flip) {
    ctx.scale(-1, 1);
  }
  ctx.translate(transform.x, transform.y);
  ctx.rotate(deg2rad(settings.boardRotation));
  ctx.scale(transform.s, transform.s);
}

function prepareLayer(canvasdict) {
  var flip = (canvasdict.layer == "B");
  for (var c of ["bg", "fab", "silk", "highlight"]) {
    prepareCanvas(canvasdict[c], flip, canvasdict.transform);
  }
}

function rotateVector(v, angle) {
  angle = deg2rad(angle);
  return [
    v[0] * Math.cos(angle) - v[1] * Math.sin(angle),
    v[0] * Math.sin(angle) + v[1] * Math.cos(angle)
  ];
}

function applyRotation(bbox) {
  var corners = [
    [bbox.minx, bbox.miny],
    [bbox.minx, bbox.maxy],
    [bbox.maxx, bbox.miny],
    [bbox.maxx, bbox.maxy],
  ];
  corners = corners.map((v) => rotateVector(v, settings.boardRotation));
  return {
    minx: corners.reduce((a, v) => Math.min(a, v[0]), Infinity),
    miny: corners.reduce((a, v) => Math.min(a, v[1]), Infinity),
    maxx: corners.reduce((a, v) => Math.max(a, v[0]), -Infinity),
    maxy: corners.reduce((a, v) => Math.max(a, v[1]), -Infinity),
  }
}

function recalcLayerScale(layerdict, width, height) {
  var bbox = applyRotation(pcbdata.edges_bbox);
  // Leave room for board-size dimension labels when enabled
  if (typeof pcbDimMode !== "undefined" && pcbDimMode && pcbDimMode != "none") {
    var span = Math.max(bbox.maxx - bbox.minx, bbox.maxy - bbox.miny);
    // Room for outward-stacked overall / segment / radius labels
    var pad = Math.max(12, span * 0.28);
    bbox = {
      minx: bbox.minx - pad,
      miny: bbox.miny - pad,
      maxx: bbox.maxx + pad,
      maxy: bbox.maxy + pad
    };
  }
  var scalefactor = 0.98 * Math.min(
    width / (bbox.maxx - bbox.minx),
    height / (bbox.maxy - bbox.miny)
  );
  if (scalefactor < 0.1) {
    scalefactor = 1;
  }
  layerdict.transform.s = scalefactor;
  var flip = (layerdict.layer == "B");
  if (flip) {
    layerdict.transform.x = -((bbox.maxx + bbox.minx) * scalefactor + width) * 0.5;
  } else {
    layerdict.transform.x = -((bbox.maxx + bbox.minx) * scalefactor - width) * 0.5;
  }
  layerdict.transform.y = -((bbox.maxy + bbox.miny) * scalefactor - height) * 0.5;
  for (var c of ["bg", "fab", "silk", "highlight"]) {
    canvas = layerdict[c];
    canvas.width = width;
    canvas.height = height;
    canvas.style.width = (width / devicePixelRatio) + "px";
    canvas.style.height = (height / devicePixelRatio) + "px";
  }
}

function redrawCanvas(layerdict) {
  prepareLayer(layerdict);
  drawBackground(layerdict);
  drawHighlightsOnLayer(layerdict);
}

function resizeCanvas(layerdict) {
  var canvasdivid = {
    "F": "frontcanvas",
    "B": "backcanvas"
  } [layerdict.layer];
  var width = document.getElementById(canvasdivid).clientWidth * devicePixelRatio;
  var height = document.getElementById(canvasdivid).clientHeight * devicePixelRatio;
  recalcLayerScale(layerdict, width, height);
  redrawCanvas(layerdict);
}

function resizeAll() {
  if (typeof settings !== "undefined" && settings.showSch &&
      typeof resizeSchCanvas === "function") {
    resizeSchCanvas();
  }
  if (typeof settings === "undefined" || settings.showPcb) {
    resizeCanvas(allcanvas.front);
    resizeCanvas(allcanvas.back);
  }
}

function pointWithinDistanceToSegment(x, y, x1, y1, x2, y2, d) {
  var A = x - x1;
  var B = y - y1;
  var C = x2 - x1;
  var D = y2 - y1;

  var dot = A * C + B * D;
  var len_sq = C * C + D * D;
  var dx, dy;
  if (len_sq == 0) {
    // start and end of the segment coincide
    dx = x - x1;
    dy = y - y1;
  } else {
    var param = dot / len_sq;
    var xx, yy;
    if (param < 0) {
      xx = x1;
      yy = y1;
    } else if (param > 1) {
      xx = x2;
      yy = y2;
    } else {
      xx = x1 + param * C;
      yy = y1 + param * D;
    }
    dx = x - xx;
    dy = y - yy;
  }
  return dx * dx + dy * dy <= d * d;
}

function pointWithinPad(x, y, pad) {
  var v = [x - pad.pos[0], y - pad.pos[1]];
  v = rotateVector(v, -pad.angle);
  if (pad.offset) {
    v[0] -= pad.offset[0];
    v[1] -= pad.offset[1];
  }
  return emptyContext2d.isPointInPath(getCachedPadPath(pad), ...v);
}

function netHitScan(layer, x, y) {
  // Check track segments
  if (settings.renderTracks && pcbdata.tracks) {
    for(var track of pcbdata.tracks[layer]) {
      if (pointWithinDistanceToSegment(x, y, ...track.start, ...track.end, track.width / 2)) {
        return track.net;
      }
    }
  }
  // Check pads
  if (settings.renderPads) {
    for (var footprint of pcbdata.footprints) {
      for(var pad of footprint.pads) {
        if (pad.layers.includes(layer) && pointWithinPad(x, y, pad)) {
          return pad.net;
        }
      }
    }
  }
  return null;
}

function pointWithinFootprintBbox(x, y, bbox) {
  var v = [x - bbox.pos[0], y - bbox.pos[1]];
  v = rotateVector(v, bbox.angle);
  return bbox.relpos[0] <= v[0] && v[0] <= bbox.relpos[0] + bbox.size[0] &&
         bbox.relpos[1] <= v[1] && v[1] <= bbox.relpos[1] + bbox.size[1];
}

function bboxHitScan(layer, x, y) {
  var result = [];
  for (var i = 0; i < pcbdata.footprints.length; i++) {
    var footprint = pcbdata.footprints[i];
    if (footprint.layer == layer) {
      if (pointWithinFootprintBbox(x, y, footprint.bbox)) {
        result.push(i);
      }
    }
  }
  return result;
}

function handlePointerDown(e, layerdict) {
  if (e.button != 0 && e.button != 1) {
    return;
  }
  e.preventDefault();
  e.stopPropagation();

  if (!e.hasOwnProperty("offsetX")) {
    // The polyfill doesn't set this properly
    e.offsetX = e.pageX - e.currentTarget.offsetLeft;
    e.offsetY = e.pageY - e.currentTarget.offsetTop;
  }

  layerdict.pointerStates[e.pointerId] = {
    distanceTravelled: 0,
    lastX: e.offsetX,
    lastY: e.offsetY,
    downTime: Date.now(),
  };
}

function handleMouseClick(e, layerdict) {
  if (!e.hasOwnProperty("offsetX")) {
    // The polyfill doesn't set this properly
    e.offsetX = e.pageX - e.currentTarget.offsetLeft;
    e.offsetY = e.pageY - e.currentTarget.offsetTop;
  }

  var x = e.offsetX;
  var y = e.offsetY;
  var t = layerdict.transform;
  if (layerdict.layer == "B") {
    x = (devicePixelRatio * x / t.zoom - t.panx + t.x) / -t.s;
  } else {
    x = (devicePixelRatio * x / t.zoom - t.panx - t.x) / t.s;
  }
  y = (devicePixelRatio * y / t.zoom - t.y - t.pany) / t.s;
  var v = rotateVector([x, y], -settings.boardRotation);

  var hitNet = null;
  if ("nets" in pcbdata) {
    hitNet = netHitScan(layerdict.layer, ...v);
  }
  if (hitNet != null) {
    if (hitNet !== highlightedNet) {
      netClicked(hitNet);
    }
    return;
  }

  var footprints = bboxHitScan(layerdict.layer, ...v);
  if (footprints.length > 0) {
    footprintsClicked(footprints);
    return;
  }

  // Click empty space — clear BOM/SCH/PCB highlight linkage
  if (typeof clearHighlightedFootprints === "function") {
    clearHighlightedFootprints();
  }
}

function handlePointerLeave(e, layerdict) {
  e.preventDefault();
  e.stopPropagation();

  if (!settings.redrawOnDrag) {
    redrawCanvas(layerdict);
  }

  delete layerdict.pointerStates[e.pointerId];
}

function resetTransform(layerdict) {
  layerdict.transform.panx = 0;
  layerdict.transform.pany = 0;
  layerdict.transform.zoom = 1;
  redrawCanvas(layerdict);
}

function handlePointerUp(e, layerdict) {
  if (!e.hasOwnProperty("offsetX")) {
    // The polyfill doesn't set this properly
    e.offsetX = e.pageX - e.currentTarget.offsetLeft;
    e.offsetY = e.pageY - e.currentTarget.offsetTop;
  }

  e.preventDefault();
  e.stopPropagation();

  if (e.button == 2) {
    // Reset pan and zoom on right click.
    resetTransform(layerdict);
    layerdict.anotherPointerTapped = false;
    return;
  }

  // We haven't necessarily had a pointermove event since the interaction started, so make sure we update this now
  var ptr = layerdict.pointerStates[e.pointerId];
  ptr.distanceTravelled += Math.abs(e.offsetX - ptr.lastX) + Math.abs(e.offsetY - ptr.lastY);

  if (e.button == 0 && ptr.distanceTravelled < 10 && Date.now() - ptr.downTime <= 500) {
    if (Object.keys(layerdict.pointerStates).length == 1) {
      if (layerdict.anotherPointerTapped) {
        // This is the second pointer coming off of a two-finger tap
        resetTransform(layerdict);
      } else {
        // This is just a regular tap
        handleMouseClick(e, layerdict);
      }
      layerdict.anotherPointerTapped = false;
    } else {
      // This is the first finger coming off of what could become a two-finger tap
      layerdict.anotherPointerTapped = true;
    }
  } else {
    if (!settings.redrawOnDrag) {
      redrawCanvas(layerdict);
    }
    layerdict.anotherPointerTapped = false;
  }

  delete layerdict.pointerStates[e.pointerId];
}

function handlePointerMove(e, layerdict) {
  if (!layerdict.pointerStates.hasOwnProperty(e.pointerId)) {
    return;
  }
  e.preventDefault();
  e.stopPropagation();

  if (!e.hasOwnProperty("offsetX")) {
    // The polyfill doesn't set this properly
    e.offsetX = e.pageX - e.currentTarget.offsetLeft;
    e.offsetY = e.pageY - e.currentTarget.offsetTop;
  }

  var thisPtr = layerdict.pointerStates[e.pointerId];

  var dx = e.offsetX - thisPtr.lastX;
  var dy = e.offsetY - thisPtr.lastY;

  // If this number is low on pointer up, we count the action as a click
  thisPtr.distanceTravelled += Math.abs(dx) + Math.abs(dy);

  if (Object.keys(layerdict.pointerStates).length == 1) {
    // This is a simple drag
    layerdict.transform.panx += devicePixelRatio * dx / layerdict.transform.zoom;
    layerdict.transform.pany += devicePixelRatio * dy / layerdict.transform.zoom;
  } else if (Object.keys(layerdict.pointerStates).length == 2) {
    var otherPtr = Object.values(layerdict.pointerStates).filter((ptr) => ptr != thisPtr)[0];

    var oldDist = Math.sqrt(Math.pow(thisPtr.lastX - otherPtr.lastX, 2) + Math.pow(thisPtr.lastY - otherPtr.lastY, 2));
    var newDist = Math.sqrt(Math.pow(e.offsetX - otherPtr.lastX, 2)     + Math.pow(e.offsetY - otherPtr.lastY, 2));

    var scaleFactor = newDist/oldDist;

    if (scaleFactor != NaN) {
      layerdict.transform.zoom *= scaleFactor;

      var zoomd = (1 - scaleFactor) / layerdict.transform.zoom;
      layerdict.transform.panx += devicePixelRatio * otherPtr.lastX * zoomd;
      layerdict.transform.pany += devicePixelRatio * otherPtr.lastY * zoomd;
    }
  }

  thisPtr.lastX = e.offsetX;
  thisPtr.lastY = e.offsetY;

  if (settings.redrawOnDrag) {
    redrawCanvas(layerdict);
  }
}

function handleMouseWheel(e, layerdict) {
  e.preventDefault();
  e.stopPropagation();
  var t = layerdict.transform;
  var wheeldelta = e.deltaY;
  if (e.deltaMode == 1) {
    // FF only, scroll by lines
    wheeldelta *= 30;
  } else if (e.deltaMode == 2) {
    wheeldelta *= 300;
  }
  var m = Math.pow(1.1, -wheeldelta / 40);
  // Limit amount of zoom per tick.
  if (m > 2) {
    m = 2;
  } else if (m < 0.5) {
    m = 0.5;
  }
  t.zoom *= m;
  var zoomd = (1 - m) / t.zoom;
  t.panx += devicePixelRatio * e.offsetX * zoomd;
  t.pany += devicePixelRatio * e.offsetY * zoomd;
  redrawCanvas(layerdict);
}

function addMouseHandlers(div, layerdict) {
  div.addEventListener("pointerdown", function(e) {
    handlePointerDown(e, layerdict);
  });
  div.addEventListener("pointermove", function(e) {
    handlePointerMove(e, layerdict);
  });
  div.addEventListener("pointerup", function(e) {
    handlePointerUp(e, layerdict);
  });
  var pointerleave = function(e) {
    handlePointerLeave(e, layerdict);
  }
  div.addEventListener("pointercancel", pointerleave);
  div.addEventListener("pointerleave", pointerleave);
  div.addEventListener("pointerout", pointerleave);

  div.onwheel = function(e) {
    handleMouseWheel(e, layerdict);
  }
  for (var element of [div, layerdict.bg, layerdict.fab, layerdict.silk, layerdict.highlight]) {
    element.addEventListener("contextmenu", function(e) {
      e.preventDefault();
    }, false);
  }
}

function setRedrawOnDrag(value) {
  settings.redrawOnDrag = value;
  writeStorage("redrawOnDrag", value);
}

function setBoardRotation(value) {
  settings.boardRotation = value * 5;
  writeStorage("boardRotation", settings.boardRotation);
  document.getElementById("rotationDegree").textContent = settings.boardRotation;
  resizeAll();
}

function initRender() {
  allcanvas = {
    front: {
      transform: {
        x: 0,
        y: 0,
        s: 1,
        panx: 0,
        pany: 0,
        zoom: 1,
      },
      pointerStates: {},
      anotherPointerTapped: false,
      bg: document.getElementById("F_bg"),
      fab: document.getElementById("F_fab"),
      silk: document.getElementById("F_slk"),
      highlight: document.getElementById("F_hl"),
      layer: "F",
    },
    back: {
      transform: {
        x: 0,
        y: 0,
        s: 1,
        panx: 0,
        pany: 0,
        zoom: 1,
      },
      pointerStates: {},
      anotherPointerTapped: false,
      bg: document.getElementById("B_bg"),
      fab: document.getElementById("B_fab"),
      silk: document.getElementById("B_slk"),
      highlight: document.getElementById("B_hl"),
      layer: "B",
    }
  };
  addMouseHandlers(document.getElementById("frontcanvas"), allcanvas.front);
  addMouseHandlers(document.getElementById("backcanvas"), allcanvas.back);
}

///////////////////////////////////////////////

///////////////////////////////////////////////
// Vector schematic renderer — pin hotspot fix + AD-like text sizes

var SCH_LINE_WIDTH = { 0: 1, 1: 4, 2: 10, 3: 20 };
// Orientation: direction from body → electrical end
var SCH_PIN_DIR = { 0: [1, 0], 90: [0, 1], 180: [-1, 0], 270: [0, -1] };

var schState = {
  sheetIndex: 0,
  transform: { x: 0, y: 0, s: 1 },
  pointerStates: {},
  highlightedRefs: []
};

// Global pin name/number visibility (all components)
var schShowPinLabels = false;

function hasSchematicData() {
  return pcbdata.schematic && pcbdata.schematic.sheets && pcbdata.schematic.sheets.length > 0;
}

function getCurrentSchSheet() {
  if (!hasSchematicData()) return null;
  if (schState.sheetIndex < 0 || schState.sheetIndex >= pcbdata.schematic.sheets.length) {
    schState.sheetIndex = 0;
  }
  return pcbdata.schematic.sheets[schState.sheetIndex];
}

function altiumColor(c, fallback) {
  if (c == null || c === undefined) return fallback || "#000080";
  var n = Number(c);
  if (isNaN(n)) return fallback || "#000080";
  var r = n & 0xFF;
  var g = (n >> 8) & 0xFF;
  var b = (n >> 16) & 0xFF;
  return "rgb(" + r + "," + g + "," + b + ")";
}

function schLineWidth(lw, defMils) {
  if (lw == null) return defMils || 4;
  return SCH_LINE_WIDTH[Number(lw)] != null ? SCH_LINE_WIDTH[Number(lw)] : (defMils || 4);
}

function schToCanvas(x, y, t) {
  var sheet = getCurrentSchSheet();
  return [t.x + t.s * x, t.y + t.s * (sheet.bbox.y1 - y)];
}

function canvasToSch(cx, cy, t) {
  var sheet = getCurrentSchSheet();
  return [(cx - t.x) / t.s, sheet.bbox.y1 - (cy - t.y) / t.s];
}

function calcSchTransform(canvas) {
  var sheet = getCurrentSchSheet();
  if (!sheet) return;
  var bbox = sheet.bbox;
  var width = Math.max(1, bbox.x1 - bbox.x0);
  var height = Math.max(1, bbox.y1 - bbox.y0);
  var t = schState.transform;
  var cw = canvas.width / devicePixelRatio;
  var ch = canvas.height / devicePixelRatio;
  var s = Math.min(cw / width, ch / height) * 0.96;
  t.s = s;
  t.x = (cw - s * width) / 2 - s * bbox.x0;
  t.y = (ch - s * height) / 2;
}

function resizeSchCanvas() {
  var div = document.getElementById("schematiccanvas");
  if (!div || div.style.display == "none") return;
  var bg = document.getElementById("S_bg");
  var hl = document.getElementById("S_hl");
  if (!bg || !hl) return;
  var w = div.clientWidth;
  var h = div.clientHeight;
  for (var c of [bg, hl]) {
    c.width = w * devicePixelRatio;
    c.height = h * devicePixelRatio;
    c.style.width = w + "px";
    c.style.height = h + "px";
    c.getContext("2d").setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  }
  calcSchTransform(bg);
  redrawSchematic();
}

function strokeWidthPx(mils, t) {
  // True vector scale (tiny floor only to avoid 0-width hairlines)
  return Math.max(0.25, (mils || 4) * t.s);
}

// Unified schematic label height (mils). Designators were oversized via bbox;
// net/power labels were hardcoded too small — keep them the same visual size.
var SCH_TEXT_MILS = 50;

function schTextMils(mils) {
  var m = Number(mils) || SCH_TEXT_MILS;
  // Pull extremes toward the common size (blue ↓, red ↑)
  if (m < 45 || m > 55) return SCH_TEXT_MILS;
  return m;
}

function fontPx(mils, t) {
  // True vector scale — must track t.s or zoom breaks relative layout / causes overlap
  return Math.max(0.5, schTextMils(mils) * t.s);
}

function drawPrim(ctx, prim, t) {
  var stroke = altiumColor(prim.color, "#8b6914");
  var fill = altiumColor(prim.area_color, "transparent");
  var lw = strokeWidthPx(schLineWidth(prim.line_width, 4), t);
  ctx.strokeStyle = stroke;
  ctx.fillStyle = fill;
  ctx.lineWidth = lw;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";

  if (prim.kind == "line") {
    var a = schToCanvas(prim.x1, prim.y1, t);
    var b = schToCanvas(prim.x2, prim.y2, t);
    ctx.beginPath();
    ctx.moveTo(a[0], a[1]);
    ctx.lineTo(b[0], b[1]);
    ctx.stroke();
  } else if (prim.kind == "rect" || prim.kind == "roundrect") {
    var p0 = schToCanvas(prim.x1, prim.y1, t);
    var p1 = schToCanvas(prim.x2, prim.y2, t);
    var x = Math.min(p0[0], p1[0]);
    var y = Math.min(p0[1], p1[1]);
    var w = Math.abs(p1[0] - p0[0]);
    var h = Math.abs(p1[1] - p0[1]);
    var rx = (prim.rx || 0) * t.s;
    var ry = (prim.ry || 0) * t.s;
    ctx.beginPath();
    if ((prim.kind == "roundrect") && (rx > 0 || ry > 0) && ctx.roundRect) {
      ctx.roundRect(x, y, w, h, [rx, ry]);
    } else {
      ctx.rect(x, y, w, h);
    }
    if (prim.is_solid) ctx.fill();
    ctx.stroke();
  } else if (prim.kind == "arc") {
    var c = schToCanvas(prim.cx, prim.cy, t);
    var r = Math.max(0.5, (prim.r || 0) * t.s);
    var start = -((prim.end != null ? prim.end : 0) * Math.PI / 180);
    var end = -((prim.start != null ? prim.start : 0) * Math.PI / 180);
    ctx.beginPath();
    if (prim.r2 && prim.r2 != prim.r) {
      ctx.ellipse(c[0], c[1], r, Math.max(0.5, (prim.r2 || prim.r) * t.s), 0, end, start, true);
    } else {
      ctx.arc(c[0], c[1], r, end, start, true);
    }
    ctx.stroke();
  } else if (prim.kind == "ellipse") {
    var ec = schToCanvas(prim.cx, prim.cy, t);
    ctx.beginPath();
    ctx.ellipse(ec[0], ec[1], Math.max(0.5, (prim.rx || 0) * t.s),
      Math.max(0.5, (prim.ry || 0) * t.s), 0, 0, Math.PI * 2);
    if (prim.is_solid) ctx.fill();
    ctx.stroke();
  } else if (prim.kind == "polyline" || prim.kind == "polygon") {
    var pts = prim.pts || [];
    if (pts.length < 2) return;
    ctx.beginPath();
    var first = schToCanvas(pts[0][0], pts[0][1], t);
    ctx.moveTo(first[0], first[1]);
    for (var i = 1; i < pts.length; i++) {
      var pt = schToCanvas(pts[i][0], pts[i][1], t);
      ctx.lineTo(pt[0], pt[1]);
    }
    if (prim.kind == "polygon") {
      ctx.closePath();
      if (prim.is_solid) ctx.fill();
    }
    ctx.stroke();
  } else if (prim.kind == "bezier") {
    var bp = prim.pts || [];
    if (bp.length < 4) return;
    ctx.beginPath();
    var b0 = schToCanvas(bp[0][0], bp[0][1], t);
    ctx.moveTo(b0[0], b0[1]);
    for (var bi = 1; bi + 2 < bp.length; bi += 3) {
      var c1 = schToCanvas(bp[bi][0], bp[bi][1], t);
      var c2 = schToCanvas(bp[bi + 1][0], bp[bi + 1][1], t);
      var c3 = schToCanvas(bp[bi + 2][0], bp[bi + 2][1], t);
      ctx.bezierCurveTo(c1[0], c1[1], c2[0], c2[1], c3[0], c3[1]);
    }
    ctx.stroke();
  }
}

function drawPolylineVerts(ctx, verts, t, color, mils) {
  if (!verts || verts.length < 2) return;
  ctx.strokeStyle = color;
  ctx.lineWidth = strokeWidthPx(mils, t);
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.beginPath();
  var p0 = schToCanvas(verts[0][0], verts[0][1], t);
  ctx.moveTo(p0[0], p0[1]);
  for (var i = 1; i < verts.length; i++) {
    var p = schToCanvas(verts[i][0], verts[i][1], t);
    ctx.lineTo(p[0], p[1]);
  }
  ctx.stroke();
}

function setSchPinLabelsVisible(show) {
  schShowPinLabels = !!show;
  if (typeof writeStorage === "function") writeStorage("schShowPinLabels", schShowPinLabels ? "1" : "0");
  var offBtn = document.getElementById("sch-pin-off");
  var onBtn = document.getElementById("sch-pin-on");
  if (offBtn) offBtn.classList.toggle("depressed", !schShowPinLabels);
  if (onBtn) onBtn.classList.toggle("depressed", !!schShowPinLabels);
  if (typeof redrawSchematic === "function") redrawSchematic();
}

function initSchPinLabelToggle() {
  var stored = null;
  if (typeof readStorage === "function") stored = readStorage("schShowPinLabels");
  if (stored == "1" || stored == "true") schShowPinLabels = true;
  else if (stored == "0" || stored == "false") schShowPinLabels = false;
  else schShowPinLabels = false; // default: hidden

  function bind(id, show) {
    var el = document.getElementById(id);
    if (!el) return;
    el.onclick = function(e) {
      e.preventDefault();
      e.stopPropagation();
      setSchPinLabelsVisible(show);
    };
  }
  bind("sch-pin-off", false);
  bind("sch-pin-on", true);

  var bar = document.getElementById("schPinBar");
  if (bar && typeof settings !== "undefined") {
    bar.style.display = (settings.showSch && hasSchematicData()) ? "" : "none";
  }
  setSchPinLabelsVisible(schShowPinLabels);
}

function drawPin(ctx, pin, t, sheet) {
  // x,y = body end; hx,hy = electrical hotspot (preferred)
  var bx = pin.x;
  var by = pin.y;
  var hx = (pin.hx != null) ? pin.hx : bx;
  var hy = (pin.hy != null) ? pin.hy : by;
  if (pin.hx == null) {
    // Fallback if old data: Orientation points body → electrical
    var dir = SCH_PIN_DIR[pin.rot] || [1, 0];
    hx = bx + dir[0] * (pin.len || 0);
    hy = by + dir[1] * (pin.len || 0);
  }
  var a = schToCanvas(hx, hy, t); // electrical
  var b = schToCanvas(bx, by, t); // body
  ctx.strokeStyle = "#000080";
  ctx.fillStyle = "#000080";
  ctx.lineWidth = strokeWidthPx(3, t);
  ctx.beginPath();
  ctx.moveTo(a[0], a[1]);
  ctx.lineTo(b[0], b[1]);
  ctx.stroke();
  // Hotspot dot (small)
  ctx.beginPath();
  ctx.arc(a[0], a[1], Math.max(0.8, 3.5 * t.s), 0, Math.PI * 2);
  ctx.fill();

  // Pin name / designator — global toggle (schPinBar)
  if (!schShowPinLabels) return;

  var name = (pin.show_name !== false && pin.name) ? String(pin.name).trim() : "";
  var des = (pin.show_des !== false && pin.des) ? String(pin.des).trim() : "";
  if (!name && !des) return;

  var mx = (bx + hx) / 2;
  var my = (by + hy) / 2;
  var mid = schToCanvas(mx, my, t);
  var pinFs = fontPx(SCH_TEXT_MILS, t);
  ctx.font = pinFs + "px Verdana, sans-serif";
  ctx.textBaseline = "middle";
  ctx.fillStyle = "#000080";
  ctx.textAlign = "center";
  // Name==Des (e.g. "1"/"1") — draw once to avoid stacked "11"
  if (name && des && name === des) {
    ctx.fillText(des, mid[0], mid[1]);
  } else if (name && des) {
    ctx.fillText(name, mid[0], mid[1] - pinFs * 0.35);
    ctx.fillText(des, mid[0], mid[1] + pinFs * 0.45);
  } else {
    ctx.fillText(name || des, mid[0], mid[1]);
  }
  ctx.textAlign = "left";
}

function powerBodyDir(orient) {
  if (orient == 0) return [1, 0];
  if (orient == 1) return [0, 1];
  if (orient == 2) return [-1, 0];
  return [0, -1];
}

function powerBodyExtent(style, stem) {
  if (style == 4 || style == 5) return stem + 16;
  if (style == 6) return stem + 18;
  if (style == 1) return stem + 14;
  if (style == 0) return stem + 18;
  if (style == 3) return stem + 10;
  return stem + 4;
}

function schLabelBBox(x, y, tw, th, align, baseline) {
  var x0 = x, y0 = y;
  if (align == "center") x0 = x - tw / 2;
  else if (align == "right") x0 = x - tw;
  if (baseline == "middle") y0 = y - th / 2;
  else if (baseline == "top") y0 = y - th;
  // bottom: anchor at lower-left of glyph box (AD-like)
  return { x1: x0, y1: y0, x2: x0 + tw, y2: y0 + th };
}

function schBoxOverlap(a, b) {
  if (!a || !b) return 0;
  var ox = Math.min(a.x2, b.x2) - Math.max(a.x1, b.x1);
  var oy = Math.min(a.y2, b.y2) - Math.max(a.y1, b.y1);
  if (ox <= 0 || oy <= 0) return 0;
  return ox * oy;
}

function collectPowerObstacles(sheet, selfPp, placed) {
  var boxes = [];
  function addPt(x, y, w, h) {
    if (x == null || y == null) return;
    var hw = (w || 40) / 2, hh = (h || 30) / 2;
    boxes.push({ x1: x - hw, y1: y - hh, x2: x + hw, y2: y + hh });
  }
  function addTxt(info) {
    if (!info || !info.text || info.hidden) return;
    var sz = schTextMils(info.size != null ? info.size : SCH_TEXT_MILS);
    var tw = Math.max(sz, String(info.text).length * sz * 0.55);
    boxes.push(schLabelBBox(info.x, info.y, tw, sz, "left", "bottom"));
  }
  if (placed && placed.length) {
    for (var i = 0; i < placed.length; i++) boxes.push(placed[i]);
  }
  if (!sheet) return boxes;
  for (var c of (sheet.components || [])) {
    if (c.bbox) {
      boxes.push({
        x1: c.bbox.x1 - 4, y1: c.bbox.y1 - 4,
        x2: c.bbox.x2 + 4, y2: c.bbox.y2 + 4
      });
    }
    addTxt(c.designator);
    addTxt(c.comment_txt);
  }
  for (var pin of (sheet.pins || [])) {
    var mx = (pin.x + ((pin.hx != null) ? pin.hx : pin.x)) / 2;
    var my = (pin.y + ((pin.hy != null) ? pin.hy : pin.y)) / 2;
    addPt(mx, my, 36, 28);
  }
  for (var nl of (sheet.net_labels || [])) addTxt(nl);
  for (var port of (sheet.ports || [])) addTxt(port);
  for (var pp of (sheet.power_ports || [])) {
    if (pp === selfPp) continue;
    addPt(pp.x, pp.y, 36, 36);
  }
  return boxes;
}

function pickPowerLabelPos(pp, orient, style, stem, sheet, placed) {
  var text = String(pp.text || "");
  var sizeMils = schTextMils(pp.size != null ? pp.size : SCH_TEXT_MILS);
  var tw = Math.max(sizeMils, text.length * sizeMils * 0.55);
  var th = sizeMils;
  var extent = powerBodyExtent(style, stem);
  var pad = 10;
  var d = powerBodyDir(orient);
  var px = pp.x, py = pp.y;
  var tipX = px + d[0] * extent;
  var tipY = py + d[1] * extent;
  var midX = px + d[0] * (extent * 0.55);
  var midY = py + d[1] * (extent * 0.55);
  var side = Math.max(24, tw * 0.4 + 8);

  // Prefer outside tip (clear of symbol), then both sides, then farther out
  var cands = [];
  if (orient == 1) {
    cands.push({ x: tipX, y: tipY + pad, align: "center", baseline: "bottom", prefer: 0 });
    cands.push({ x: midX + side, y: midY, align: "left", baseline: "middle", prefer: 1 });
    cands.push({ x: midX - side, y: midY, align: "right", baseline: "middle", prefer: 1 });
    cands.push({ x: tipX, y: tipY + pad + th + 8, align: "center", baseline: "bottom", prefer: 2 });
  } else if (orient == 3) {
    cands.push({ x: tipX, y: tipY - pad, align: "center", baseline: "top", prefer: 0 });
    cands.push({ x: midX + side, y: midY, align: "left", baseline: "middle", prefer: 1 });
    cands.push({ x: midX - side, y: midY, align: "right", baseline: "middle", prefer: 1 });
    cands.push({ x: tipX, y: tipY - pad - th - 8, align: "center", baseline: "top", prefer: 2 });
  } else if (orient == 0) {
    cands.push({ x: tipX + pad, y: tipY, align: "left", baseline: "middle", prefer: 0 });
    cands.push({ x: midX, y: midY + side, align: "center", baseline: "bottom", prefer: 1 });
    cands.push({ x: midX, y: midY - side, align: "center", baseline: "top", prefer: 1 });
    cands.push({ x: tipX + pad + tw * 0.15, y: tipY, align: "left", baseline: "middle", prefer: 2 });
  } else {
    cands.push({ x: tipX - pad, y: tipY, align: "right", baseline: "middle", prefer: 0 });
    cands.push({ x: midX, y: midY + side, align: "center", baseline: "bottom", prefer: 1 });
    cands.push({ x: midX, y: midY - side, align: "center", baseline: "top", prefer: 1 });
    cands.push({ x: tipX - pad - tw * 0.15, y: tipY, align: "right", baseline: "middle", prefer: 2 });
  }

  // Own glyph body — heavy penalty if label sits on the symbol
  var halfW = (orient == 1 || orient == 3) ? 20 : extent * 0.5;
  var halfH = (orient == 1 || orient == 3) ? extent * 0.5 : 20;
  var bodyCx = px + d[0] * extent * 0.5;
  var bodyCy = py + d[1] * extent * 0.5;
  var bodyBox = {
    x1: bodyCx - halfW, y1: bodyCy - halfH,
    x2: bodyCx + halfW, y2: bodyCy + halfH
  };

  var obstacles = collectPowerObstacles(sheet, pp, placed);
  var best = cands[0], bestScore = 1e18;
  for (var i = 0; i < cands.length; i++) {
    var c = cands[i];
    var box = schLabelBBox(c.x, c.y, tw, th, c.align, c.baseline);
    var score = c.prefer * 120;
    score += schBoxOverlap(box, bodyBox) * 8;
    for (var j = 0; j < obstacles.length; j++) {
      score += schBoxOverlap(box, obstacles[j]);
    }
    if (score < bestScore) {
      bestScore = score;
      best = c;
      best.box = box;
    }
  }
  return best;
}

function drawPowerPort(ctx, pp, t, sheet, placedLabels) {
  // Style: 0 Circle, 1 Arrow, 2 Bar, 3 Wave, 4 GndPower, 5 GndSignal, 6 GndEarth
  var style = Number(pp.style) || 0;
  var orient = (pp.orient != null) ? Number(pp.orient) : Math.round((pp.rot || 0) / 90);
  if (isNaN(orient) || orient < 0 || orient > 3) orient = 1;
  // Local drawing: +Y = body direction away from hotspot.
  // AD Orientation: 0=right, 1=up, 2=left, 3=down (same as pins).
  var s = t.s;
  var col = altiumColor(pp.color, "#ff0000");
  ctx.strokeStyle = col;
  ctx.fillStyle = col;
  ctx.lineWidth = strokeWidthPx(3, t);
  ctx.lineCap = "round";
  ctx.lineJoin = "round";

  var origin = schToCanvas(pp.x, pp.y, t);
  ctx.save();
  ctx.translate(origin[0], origin[1]);
  // Local +Y maps to screen-up via L(); rotate so +Y points to AD orientation
  // orient1/up -> 0deg, orient0/right -> +90, orient2/left -> -90, orient3/down -> 180
  var rotDeg = (1 - orient) * 90;
  ctx.rotate(rotDeg * Math.PI / 180);

  function L(x, y) { return [x * s, -y * s]; } // local sch-up -> canvas
  function line(x1, y1, x2, y2) {
    var a = L(x1, y1), b = L(x2, y2);
    ctx.beginPath();
    ctx.moveTo(a[0], a[1]);
    ctx.lineTo(b[0], b[1]);
    ctx.stroke();
  }
  function circle(x, y, r, fill) {
    var c = L(x, y);
    ctx.beginPath();
    ctx.arc(c[0], c[1], Math.max(1, r * s), 0, Math.PI * 2);
    if (fill) ctx.fill();
    else ctx.stroke();
  }

  // Stem from hotspot along +Y (body direction in local space)
  var stem = 20;
  if (style == 4 || style == 5 || style == 6) {
    // Ground styles
    line(0, 0, 0, stem);
    if (style == 6) {
      line(-14, stem, 14, stem);
      line(-10, stem + 6, 0, stem + 16);
      line(10, stem + 6, 0, stem + 16);
    } else if (style == 5) {
      line(-16, stem, 16, stem);
      line(-10, stem + 7, 10, stem + 7);
      line(-4, stem + 14, 4, stem + 14);
    } else {
      line(-18, stem, 18, stem);
      line(-12, stem + 7, 12, stem + 7);
      line(-6, stem + 14, 6, stem + 14);
    }
  } else if (style == 2) {
    line(0, 0, 0, stem);
    line(-14, stem, 14, stem);
  } else if (style == 1) {
    line(0, 0, 0, stem);
    var a1 = L(-8, stem - 2), a2 = L(0, stem + 12), a3 = L(8, stem - 2);
    ctx.beginPath();
    ctx.moveTo(a1[0], a1[1]);
    ctx.lineTo(a2[0], a2[1]);
    ctx.lineTo(a3[0], a3[1]);
    ctx.closePath();
    ctx.fill();
  } else if (style == 3) {
    line(0, 0, 0, stem - 4);
    var w0 = L(-12, stem), w1 = L(-4, stem + 8), w2 = L(4, stem), w3 = L(12, stem + 8);
    ctx.beginPath();
    ctx.moveTo(w0[0], w0[1]);
    ctx.quadraticCurveTo(w1[0], w1[1], ((w0[0]+w2[0])/2), ((w0[1]+w2[1])/2));
    ctx.quadraticCurveTo(w3[0], w3[1], w2[0], w2[1]);
    ctx.stroke();
  } else {
    line(0, 0, 0, stem);
    circle(0, stem + 8, 8, false);
  }
  ctx.restore();

  if (pp.show_name !== false && pp.text) {
    var pos = pickPowerLabelPos(pp, orient, style, stem, sheet, placedLabels);
    drawSchText(ctx, {
      text: pp.text,
      x: pos.x, y: pos.y,
      rot: 0,
      color: pp.color,
      size: (pp.size != null) ? pp.size : SCH_TEXT_MILS,
      hidden: false,
      align: pos.align,
      baseline: pos.baseline
    }, t, "#ff0000");
    if (placedLabels && pos.box) placedLabels.push(pos.box);
  }
}

function drawSchText(ctx, info, t, fallbackColor) {
  if (!info || !info.text || info.hidden) return;
  var p = schToCanvas(info.x, info.y, t);
  var size = fontPx(info.size != null ? info.size : SCH_TEXT_MILS, t);
  ctx.fillStyle = altiumColor(info.color, fallbackColor || "#0000ff");
  ctx.font = size + "px Verdana, sans-serif";
  // AD Location is typically lower-left of text for default justification
  ctx.textBaseline = info.baseline || "bottom";
  ctx.textAlign = info.align || "left";
  if (!info.align && !info.baseline) {
    var just = Number(info.just) || 0;
    // Common TTextJustification: 0 left-bottom, others vary — keep left-bottom default
    if (just == 1 || just == 2) ctx.textAlign = "center";
    if (just == 2 || just == 5 || just == 8) ctx.textAlign = "right";
  }
  ctx.save();
  if (info.rot) {
    ctx.translate(p[0], p[1]);
    ctx.rotate(-(info.rot) * Math.PI / 180);
    ctx.fillText(info.text, 0, 0);
  } else {
    ctx.fillText(info.text, p[0], p[1]);
  }
  ctx.restore();
}

function drawNoErc(ctx, ne, t) {
  if (!ne) return;
  var p = schToCanvas(ne.x, ne.y, t);
  var arm = Math.max(3, 8 * t.s); // ~8 mil visual arms
  var col = altiumColor(ne.color, "#ff0000");
  ctx.save();
  ctx.strokeStyle = col;
  ctx.lineWidth = Math.max(1.2, strokeWidthPx(4, t));
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(p[0] - arm, p[1] - arm);
  ctx.lineTo(p[0] + arm, p[1] + arm);
  ctx.moveTo(p[0] - arm, p[1] + arm);
  ctx.lineTo(p[0] + arm, p[1] - arm);
  ctx.stroke();
  ctx.restore();
}

function drawCompileMask(ctx, mask, t) {
  if (!mask) return;
  var p0 = schToCanvas(mask.x1, mask.y1, t);
  var p1 = schToCanvas(mask.x2, mask.y2, t);
  var x = Math.min(p0[0], p1[0]);
  var y = Math.min(p0[1], p1[1]);
  var w = Math.abs(p1[0] - p0[0]);
  var h = Math.abs(p1[1] - p0[1]);
  if (w < 1 || h < 1) return;

  var stroke = altiumColor(mask.color, "#6060c0");
  var fill = altiumColor(mask.area_color, "#a0a0e0");
  ctx.save();
  // Soft fill only — no hatch lines
  ctx.globalAlpha = 0.22;
  ctx.fillStyle = fill;
  ctx.fillRect(x, y, w, h);
  // Border
  ctx.globalAlpha = 0.85;
  ctx.strokeStyle = stroke;
  ctx.lineWidth = Math.max(1, strokeWidthPx(schLineWidth(mask.line_width, 4), t));
  ctx.setLineDash([Math.max(3, 6 * t.s), Math.max(2, 4 * t.s)]);
  ctx.strokeRect(x, y, w, h);
  ctx.restore();
}

function drawSchSheet(ctx, sheet, t, highlightOnly) {
  var hiSet = {};
  for (var r of schState.highlightedRefs) hiSet[r] = true;

  if (!highlightOnly) {
    ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);

    var a = schToCanvas(sheet.bbox.x0, sheet.bbox.y0, t);
    var b = schToCanvas(sheet.bbox.x1, sheet.bbox.y1, t);
    ctx.strokeStyle = "#999";
    ctx.lineWidth = 1;
    ctx.strokeRect(Math.min(a[0], b[0]), Math.min(a[1], b[1]),
      Math.abs(b[0] - a[0]), Math.abs(b[1] - a[1]));

    for (var bus of (sheet.buses || [])) {
      drawPolylineVerts(ctx, bus.verts, t, "#0000aa", 10);
    }
    for (var wire of (sheet.wires || [])) {
      drawPolylineVerts(ctx, wire.verts, t, "#008800", 5);
    }

    for (var ss of (sheet.sheet_symbols || [])) {
      var s0 = schToCanvas(ss.x, ss.y, t);
      var s1 = schToCanvas(ss.x + (ss.w || 0), ss.y + (ss.h || 0), t);
      ctx.strokeStyle = altiumColor(ss.color, "#7f00ff");
      ctx.lineWidth = strokeWidthPx(5, t);
      ctx.strokeRect(Math.min(s0[0], s1[0]), Math.min(s0[1], s1[1]),
        Math.abs(s1[0] - s0[0]), Math.abs(s1[1] - s0[1]));
    }

    for (var comp of sheet.components) {
      for (var prim of (comp.primitives || [])) {
        drawPrim(ctx, prim, t);
      }
      if (!comp.primitives || comp.primitives.length == 0) {
        var bb = comp.bbox;
        var c0 = schToCanvas(bb.x1, bb.y1, t);
        var c1 = schToCanvas(bb.x2, bb.y2, t);
        ctx.strokeStyle = "#8b6914";
        ctx.lineWidth = strokeWidthPx(5, t);
        ctx.strokeRect(Math.min(c0[0], c1[0]), Math.min(c0[1], c1[1]),
          Math.abs(c1[0] - c0[0]), Math.abs(c1[1] - c0[1]));
      }
      // True-position designator / comment (small)
      if (comp.designator) {
        drawSchText(ctx, comp.designator, t, "#0000ff");
      } else if (comp.ref) {
        drawSchText(ctx, {
          text: comp.ref,
          x: comp.bbox.x1,
          y: comp.bbox.y2 + 10,
          size: SCH_TEXT_MILS,
          color: 16711680
        }, t, "#0000ff");
      }
      if (comp.comment_txt && comp.comment_txt.text) {
        drawSchText(ctx, comp.comment_txt, t, "#008000");
      } else if (comp.value) {
        drawSchText(ctx, {
          text: comp.value,
          x: comp.bbox.x1,
          y: comp.bbox.y1 - 5,
          size: SCH_TEXT_MILS,
          color: 32768
        }, t, "#008000");
      }
    }

    for (var pin of (sheet.pins || [])) {
      drawPin(ctx, pin, t, sheet);
    }

    // NoERC red crosses (placed + synthetic for open pins)
    for (var ne of (sheet.no_erc || [])) {
      drawNoErc(ctx, ne, t);
    }

    for (var j of (sheet.junctions || [])) {
      var jxy = schToCanvas(j.x, j.y, t);
      ctx.fillStyle = "#008800";
      ctx.beginPath();
      ctx.arc(jxy[0], jxy[1], Math.max(1.2, 12 * t.s), 0, Math.PI * 2);
      ctx.fill();
    }

    for (var nl of (sheet.net_labels || [])) {
      drawSchText(ctx, {
        text: nl.text,
        x: nl.x, y: nl.y,
        rot: nl.rot || 0,
        color: nl.color,
        size: (nl.size != null) ? nl.size : SCH_TEXT_MILS,
        hidden: false
      }, t, "#800000");
    }

    for (var port of (sheet.ports || [])) {
      drawSchText(ctx, {
        text: port.text,
        x: port.x, y: port.y,
        rot: port.rot || 0,
        color: port.color,
        size: (port.size != null) ? port.size : SCH_TEXT_MILS
      }, t, "#7f00ff");
    }

    var powerPlaced = [];
    for (var pp of (sheet.power_ports || [])) {
      drawPowerPort(ctx, pp, t, sheet, powerPlaced);
    }

    // Compile masks as translucent overlay (AD shield)
    for (var cm of (sheet.compile_masks || [])) {
      drawCompileMask(ctx, cm, t);
    }
  }

  // Highlight
  ctx.save();
  for (var hc of sheet.components) {
    if (!hiSet[hc.ref]) continue;
    var hb = hc.bbox;
    var h0 = schToCanvas(hb.x1, hb.y1, t);
    var h1 = schToCanvas(hb.x2, hb.y2, t);
    var hx = Math.min(h0[0], h1[0]) - 2;
    var hy = Math.min(h0[1], h1[1]) - 2;
    var hw = Math.abs(h1[0] - h0[0]) + 4;
    var hh = Math.abs(h1[1] - h0[1]) + 4;
    ctx.fillStyle = "rgba(208,64,64,0.22)";
    ctx.strokeStyle = "#D04040";
    ctx.lineWidth = 1.5;
    ctx.fillRect(hx, hy, hw, hh);
    ctx.strokeRect(hx, hy, hw, hh);
  }
  ctx.restore();
}

function redrawSchematic() {
  if (!hasSchematicData()) return;
  var sheet = getCurrentSchSheet();
  if (!sheet) return;
  var bg = document.getElementById("S_bg");
  var hl = document.getElementById("S_hl");
  if (!bg || !hl) return;
  var t = schState.transform;
  drawSchSheet(bg.getContext("2d"), sheet, t, false);
  var hctx = hl.getContext("2d");
  hctx.clearRect(0, 0, hl.width, hl.height);
  if (schState.highlightedRefs.length > 0) {
    drawSchSheet(hctx, sheet, t, true);
  }
}

function drawSchematicHighlights(refs) {
  schState.highlightedRefs = refs || [];
  if (settings.showSch) redrawSchematic();
}

function hitTestSchComponent(sx, sy) {
  var sheet = getCurrentSchSheet();
  if (!sheet) return null;
  var best = null;
  var bestArea = Infinity;
  for (var c of sheet.components) {
    var bb = c.bbox;
    if (sx >= bb.x1 && sx <= bb.x2 && sy >= bb.y1 && sy <= bb.y2) {
      var area = (bb.x2 - bb.x1) * (bb.y2 - bb.y1);
      if (area < bestArea) {
        bestArea = area;
        best = c;
      }
    }
  }
  return best;
}

function schRefsToBomHighlight(ref) {
  for (var i = 0; i < pcbdata.footprints.length; i++) {
    if (pcbdata.footprints[i].ref == ref) {
      var handler = footprintIndexToHandler[i];
      if (handler) {
        handler();
        return;
      }
    }
  }
  drawSchematicHighlights([ref]);
}

function changeSchSheet(index) {
  schState.sheetIndex = parseInt(index) || 0;
  schState.transform = { x: 0, y: 0, s: 1 };
  resizeSchCanvas();
}

function initSchSheetSelector() {
  var sel = document.getElementById("schSheetSelect");
  if (!sel) return;
  sel.innerHTML = "";
  if (!hasSchematicData()) {
    sel.style.display = "none";
    return;
  }
  for (var i = 0; i < pcbdata.schematic.sheets.length; i++) {
    var opt = document.createElement("option");
    opt.value = i;
    opt.textContent = pcbdata.schematic.sheets[i].name || ("Sheet " + (i + 1));
    sel.appendChild(opt);
  }
  sel.value = schState.sheetIndex;
  sel.style.display = settings.showSch ? "" : "none";
}

function addSchMouseHandlers() {
  var div = document.getElementById("schematiccanvas");
  if (!div) return;
  var t = schState.transform;

  div.addEventListener("pointerdown", function(e) {
    e.preventDefault();
    e.target.setPointerCapture(e.pointerId);
    schState.pointerStates[e.pointerId] = {
      distanceTravelled: 0,
      lastX: e.offsetX,
      lastY: e.offsetY,
      downTime: Date.now()
    };
  });

  div.addEventListener("pointermove", function(e) {
    if (!(e.pointerId in schState.pointerStates)) return;
    e.preventDefault();
    var st = schState.pointerStates[e.pointerId];
    var dx = e.offsetX - st.lastX;
    var dy = e.offsetY - st.lastY;
    st.distanceTravelled += Math.abs(dx) + Math.abs(dy);
    st.lastX = e.offsetX;
    st.lastY = e.offsetY;
    if (e.buttons) {
      t.x += dx;
      t.y += dy;
      if (settings.redrawOnDrag) redrawSchematic();
    }
  });

  div.addEventListener("pointerup", function(e) {
    e.preventDefault();
    e.target.releasePointerCapture(e.pointerId);
    if (!(e.pointerId in schState.pointerStates)) return;
    var st = schState.pointerStates[e.pointerId];
    var isClick = (Date.now() - st.downTime) < 500 && st.distanceTravelled < 10;
    delete schState.pointerStates[e.pointerId];
    if (!settings.redrawOnDrag) redrawSchematic();
    if (isClick) {
      var xy = canvasToSch(e.offsetX, e.offsetY, t);
      var hit = hitTestSchComponent(xy[0], xy[1]);
      if (hit) {
        schRefsToBomHighlight(hit.ref);
      } else if (typeof clearHighlightedFootprints === "function") {
        // Click empty schematic space — clear highlight linkage
        clearHighlightedFootprints();
      }
    }
  });

  div.addEventListener("wheel", function(e) {
    e.preventDefault();
    var oldS = t.s;
    var factor = e.deltaY < 0 ? 1.1 : 1 / 1.1;
    t.s *= factor;
    t.x = e.offsetX - (e.offsetX - t.x) * (t.s / oldS);
    t.y = e.offsetY - (e.offsetY - t.y) * (t.s / oldS);
    redrawSchematic();
  }, { passive: false });
}

function initSchematicRender() {
  initSchSheetSelector();
  addSchMouseHandlers();
  initSchPinLabelToggle();
}

///////////////////////////////////////////////

///////////////////////////////////////////////
// PCB board-size annotations (mm / mil). Drawn on PCB front & back canvases.
// Mode: "none" | "mm" | "mil"
// Overall W/H + corner radii + irregular outline segments, with outward lanes
// so labels do not stack on top of each other.
var pcbDimMode = "mm";

function getBoardDimBox() {
  if (!pcbdata || !pcbdata.edges_bbox) return null;
  var b = pcbdata.edges_bbox;
  return {
    minx: Number(b.minx),
    miny: Number(b.miny),
    maxx: Number(b.maxx),
    maxy: Number(b.maxy)
  };
}

function formatDimValue(mmVal) {
  var n = Math.abs(Number(mmVal));
  if (!isFinite(n)) return "?";
  if (pcbDimMode == "mil") {
    var mil = n / 25.4 * 1000;
    var s = (Math.abs(mil - Math.round(mil)) < 0.05) ? String(Math.round(mil)) : mil.toFixed(1);
    return s + " mil";
  }
  var s2 = n.toFixed(2).replace(/\.?0+$/, "");
  if (s2.indexOf(".") < 0) s2 += ".0";
  return s2 + " mm";
}

function formatRadiusValue(mmVal) {
  var n = Math.abs(Number(mmVal));
  if (!isFinite(n)) return "R?";
  if (pcbDimMode == "mil") {
    var mil = n / 25.4 * 1000;
    var s = (Math.abs(mil - Math.round(mil)) < 0.05) ? String(Math.round(mil)) : mil.toFixed(1);
    return "R" + s + " mil";
  }
  var s2 = n.toFixed(2).replace(/\.?0+$/, "");
  if (s2.indexOf(".") < 0) s2 += ".0";
  return "R" + s2 + " mm";
}

function drawDimArrowLine(ctx, x1, y1, x2, y2, tick) {
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.stroke();
  var dx = x2 - x1;
  var dy = y2 - y1;
  var len = Math.sqrt(dx * dx + dy * dy) || 1;
  var px = -dy / len * tick;
  var py = dx / len * tick;
  ctx.beginPath();
  ctx.moveTo(x1 - px, y1 - py);
  ctx.lineTo(x1 + px, y1 + py);
  ctx.moveTo(x2 - px, y2 - py);
  ctx.lineTo(x2 + px, y2 + py);
  ctx.stroke();
}

function drawDimLabel(ctx, text, x, y, angleRad, flip) {
  ctx.save();
  ctx.translate(x, y);
  if (flip) ctx.scale(-1, 1);
  if (angleRad) ctx.rotate(angleRad);
  ctx.fillText(text, 0, 0);
  ctx.restore();
}

function flattenBoardEdges(edges) {
  var out = [];
  if (!edges) return out;
  for (var i = 0; i < edges.length; i++) {
    var e = edges[i];
    if (!e) continue;
    if (Object.prototype.toString.call(e) === "[object Array]") {
      out = out.concat(flattenBoardEdges(e));
    } else {
      out.push(e);
    }
  }
  return out;
}

function arcMidAngleDeg(a0, a1) {
  var s = Number(a0) || 0;
  var e = Number(a1) || 0;
  while (e < s) e += 360;
  return s + (e - s) / 2;
}

function arcSweepDeg(a0, a1) {
  var s = Number(a0) || 0;
  var e = Number(a1) || 0;
  while (e < s) e += 360;
  return e - s;
}

function estimateLabelBox(text, fontMm, rotated) {
  var tw = Math.max(fontMm, String(text).length * fontMm * 0.58);
  var th = fontMm * 1.15;
  if (rotated) return { w: th, h: tw };
  return { w: tw, h: th };
}

function boxesOverlap(a, b, pad) {
  pad = pad || 0;
  return !(
    a.x + a.w / 2 + pad < b.x - b.w / 2 ||
    b.x + b.w / 2 + pad < a.x - a.w / 2 ||
    a.y + a.h / 2 + pad < b.y - b.h / 2 ||
    b.y + b.h / 2 + pad < a.y - a.h / 2
  );
}

function registerLabel(placed, x, y, text, fontMm, rotated, pad) {
  var sz = estimateLabelBox(text, fontMm, rotated);
  var box = { x: x, y: y, w: sz.w, h: sz.h };
  for (var i = 0; i < placed.length; i++) {
    if (boxesOverlap(box, placed[i], pad)) return false;
  }
  placed.push(box);
  return true;
}

function placeLabelOutward(placed, x0, y0, text, fontMm, rotated, dirX, dirY, step, maxSteps, pad) {
  var dlen = Math.sqrt(dirX * dirX + dirY * dirY) || 1;
  dirX /= dlen;
  dirY /= dlen;
  step = step || fontMm * 1.35;
  maxSteps = maxSteps || 16;
  pad = pad || fontMm * 0.35;
  for (var s = 0; s < maxSteps; s++) {
    var x = x0 + dirX * step * s;
    var y = y0 + dirY * step * s;
    if (registerLabel(placed, x, y, text, fontMm, rotated, pad)) {
      return { x: x, y: y, steps: s };
    }
  }
  // Last resort: force far out
  var fx = x0 + dirX * step * maxSteps;
  var fy = y0 + dirY * step * maxSteps;
  var sz = estimateLabelBox(text, fontMm, rotated);
  placed.push({ x: fx, y: fy, w: sz.w, h: sz.h });
  return { x: fx, y: fy, steps: maxSteps };
}

// Assign non-overlapping "lanes" for parallel dims on one side
function assignDimLanes(items, spanPad) {
  // items: [{a,b,...}] intervals along the edge axis
  items.sort(function (u, v) { return u.a - v.a; });
  var laneEnds = []; // last b per lane
  for (var i = 0; i < items.length; i++) {
    var it = items[i];
    var lane = -1;
    for (var L = 0; L < laneEnds.length; L++) {
      if (it.a >= laneEnds[L] - spanPad) {
        lane = L;
        break;
      }
    }
    if (lane < 0) {
      lane = laneEnds.length;
      laneEnds.push(it.b);
    } else {
      laneEnds[lane] = Math.max(laneEnds[lane], it.b);
    }
    it.lane = lane;
  }
  return items;
}

// Skip dimensions that belong to footprints / pads (component-local geometry)
function pointInsideAnyFootprint(x, y) {
  if (!pcbdata || !pcbdata.footprints) return false;
  for (var i = 0; i < pcbdata.footprints.length; i++) {
    var fp = pcbdata.footprints[i];
    if (!fp || !fp.bbox) continue;
    if (typeof pointWithinFootprintBbox === "function") {
      if (pointWithinFootprintBbox(x, y, fp.bbox)) return true;
    } else if (fp.bbox.pos && fp.bbox.size) {
      var px = fp.bbox.pos[0], py = fp.bbox.pos[1];
      var sx = fp.bbox.size[0], sy = fp.bbox.size[1];
      if (x >= px && x <= px + sx && y >= py && y <= py + sy) return true;
    }
  }
  return false;
}

function pointNearAnyPad(x, y, margin) {
  if (!pcbdata || !pcbdata.footprints) return false;
  margin = margin || 0.4;
  for (var i = 0; i < pcbdata.footprints.length; i++) {
    var pads = pcbdata.footprints[i] && pcbdata.footprints[i].pads;
    if (!pads) continue;
    for (var j = 0; j < pads.length; j++) {
      var p = pads[j];
      if (!p || !p.pos || !p.size) continue;
      var rx = Math.max(Number(p.size[0]) || 0, Number(p.size[1]) || 0) * 0.5 + margin;
      var dx = x - p.pos[0];
      var dy = y - p.pos[1];
      if (dx * dx + dy * dy <= rx * rx) return true;
    }
  }
  return false;
}

function isComponentRelatedPoint(x, y) {
  return pointInsideAnyFootprint(x, y) || pointNearAnyPad(x, y, 0.6);
}

function drawCornerRadiusAnnotations(ctx, edges, box, flip, fontMm, gap, placed) {
  var bx = (box.minx + box.maxx) / 2;
  var by = (box.miny + box.maxy) / 2;
  var span = Math.min(box.maxx - box.minx, box.maxy - box.miny);
  var minR = Math.max(0.45, span * 0.004); // skip tiny decorative radii
  var seen = {};
  var candidates = [];
  var i;

  for (i = 0; i < edges.length; i++) {
    var e = edges[i];
    if (!e || e.type != "arc") continue;
    var r = Number(e.radius) || 0;
    if (r < minR) continue;
    // Prefer corner fillets (~90deg); skip full circles / tiny chips
    var sweep = arcSweepDeg(e.startangle, e.endangle);
    if (sweep < 55 || sweep > 130) continue;

    var cx = e.start[0];
    var cy = e.start[1];
    // Skip arcs whose center is deep inside (internal features)
    var inset = Math.min(
      Math.abs(cx - box.minx), Math.abs(box.maxx - cx),
      Math.abs(cy - box.miny), Math.abs(box.maxy - cy)
    );
    if (inset > r * 3.5 + 2) continue;

    var mid = arcMidAngleDeg(e.startangle, e.endangle);
    var midRad = (typeof deg2rad === "function") ? deg2rad(mid) : (mid * Math.PI / 180);
    var mx = cx + r * Math.cos(midRad);
    var my = cy + r * Math.sin(midRad);
    // Do not label radii tied to footprints / pads (e.g. BAT, mounting holes)
    if (isComponentRelatedPoint(cx, cy) || isComponentRelatedPoint(mx, my)) continue;

    var key = r.toFixed(2) + "@" + cx.toFixed(2) + "," + cy.toFixed(2);
    if (seen[key]) continue;
    seen[key] = true;

    var vx = mx - bx;
    var vy = my - by;
    var vlen = Math.sqrt(vx * vx + vy * vy) || 1;
    candidates.push({
      r: r,
      mx: mx,
      my: my,
      dx: vx / vlen,
      dy: vy / vlen,
      text: formatRadiusValue(r)
    });
  }

  // Longer leaders for denser corners: start further out
  var base = Math.max(fontMm * 1.6, gap * 0.55);
  for (i = 0; i < candidates.length; i++) {
    var c = candidates[i];
    var startX = c.mx + c.dx * base;
    var startY = c.my + c.dy * base;
    var pos = placeLabelOutward(
      placed, startX, startY, c.text, fontMm, false,
      c.dx, c.dy, fontMm * 1.45, 18, fontMm * 0.4
    );
    ctx.beginPath();
    ctx.moveTo(c.mx, c.my);
    ctx.lineTo(pos.x, pos.y);
    ctx.stroke();
    drawDimLabel(ctx, c.text, pos.x, pos.y, 0, flip);
  }
}

function drawIrregularSegmentAnnotations(ctx, edges, box, flip, gap, tick, fontMm, placed) {
  var overallW = box.maxx - box.minx;
  var overallH = box.maxy - box.miny;
  var minLen = Math.max(1.0, Math.min(overallW, overallH) * 0.02);
  var dims = [];
  var i;

  for (i = 0; i < edges.length; i++) {
    var e = edges[i];
    if (!e || e.type != "segment") continue;
    var x1 = e.start[0], y1 = e.start[1];
    var x2 = e.end[0], y2 = e.end[1];
    var dx = Math.abs(x2 - x1);
    var dy = Math.abs(y2 - y1);
    if (dx < 0.25 && dy < 0.25) continue;

    var mx = (x1 + x2) / 2;
    var my = (y1 + y2) / 2;
    // Skip segments that sit inside / on components (not board outline)
    if (isComponentRelatedPoint(mx, my)) continue;

    if (dy < 0.35 && dx >= minLen) {
      if (Math.abs(dx - overallW) < 0.45) continue;
      dims.push({
        horiz: true,
        a: Math.min(x1, x2),
        b: Math.max(x1, x2),
        c: (y1 + y2) / 2,
        len: dx
      });
    } else if (dx < 0.35 && dy >= minLen) {
      if (Math.abs(dy - overallH) < 0.45) continue;
      dims.push({
        horiz: false,
        a: Math.min(y1, y2),
        b: Math.max(y1, y2),
        c: (x1 + x2) / 2,
        len: dy
      });
    }
  }

  // Dedupe
  var uniq = [];
  var seen = {};
  for (i = 0; i < dims.length; i++) {
    var d = dims[i];
    var k = (d.horiz ? "H" : "V") + ":" +
      d.a.toFixed(2) + "-" + d.b.toFixed(2) + "@" + d.c.toFixed(1);
    if (seen[k]) continue;
    seen[k] = true;
    uniq.push(d);
  }

  // Split by side, assign lanes, draw from outer lanes first
  var groups = { top: [], bottom: [], left: [], right: [] };
  for (i = 0; i < uniq.length; i++) {
    d = uniq[i];
    if (d.horiz) {
      if (Math.abs(d.c - box.miny) <= Math.abs(d.c - box.maxy)) groups.top.push(d);
      else groups.bottom.push(d);
    } else {
      if (Math.abs(d.c - box.minx) <= Math.abs(d.c - box.maxx)) groups.left.push(d);
      else groups.right.push(d);
    }
  }

  var lanePitch = fontMm * 2.4;
  var baseOff = Math.max(gap * 0.7, fontMm * 2.0);

  function drawGroup(list, side) {
    if (!list.length) return;
    assignDimLanes(list, fontMm * 0.8);
    for (var gi = 0; gi < list.length; gi++) {
      var g = list[gi];
      var text = formatDimValue(g.len);
      var lane = g.lane || 0;
      var off = baseOff + lane * lanePitch;

      if (side == "top") {
        var yLine = g.c - off;
        var yText = yLine - fontMm * 0.85;
        // If label collides, push more lanes out
        var pos = placeLabelOutward(
          placed, (g.a + g.b) / 2, yText, text, fontMm, false,
          0, -1, lanePitch, 10, fontMm * 0.35
        );
        yLine = Math.min(yLine, pos.y + fontMm * 0.85);
        ctx.beginPath();
        ctx.moveTo(g.a, g.c); ctx.lineTo(g.a, yLine);
        ctx.moveTo(g.b, g.c); ctx.lineTo(g.b, yLine);
        ctx.stroke();
        drawDimArrowLine(ctx, g.a, yLine, g.b, yLine, tick * 0.7);
        drawDimLabel(ctx, text, pos.x, pos.y, 0, flip);
      } else if (side == "bottom") {
        yLine = g.c + off;
        yText = yLine + fontMm * 0.85;
        pos = placeLabelOutward(
          placed, (g.a + g.b) / 2, yText, text, fontMm, false,
          0, 1, lanePitch, 10, fontMm * 0.35
        );
        yLine = Math.max(yLine, pos.y - fontMm * 0.85);
        ctx.beginPath();
        ctx.moveTo(g.a, g.c); ctx.lineTo(g.a, yLine);
        ctx.moveTo(g.b, g.c); ctx.lineTo(g.b, yLine);
        ctx.stroke();
        drawDimArrowLine(ctx, g.a, yLine, g.b, yLine, tick * 0.7);
        drawDimLabel(ctx, text, pos.x, pos.y, 0, flip);
      } else if (side == "left") {
        var xLine = g.c - off;
        var xText = xLine - fontMm * 0.85;
        pos = placeLabelOutward(
          placed, xText, (g.a + g.b) / 2, text, fontMm, true,
          -1, 0, lanePitch, 10, fontMm * 0.35
        );
        xLine = Math.min(xLine, pos.x + fontMm * 0.85);
        ctx.beginPath();
        ctx.moveTo(g.c, g.a); ctx.lineTo(xLine, g.a);
        ctx.moveTo(g.c, g.b); ctx.lineTo(xLine, g.b);
        ctx.stroke();
        drawDimArrowLine(ctx, xLine, g.a, xLine, g.b, tick * 0.7);
        drawDimLabel(ctx, text, pos.x, pos.y, -Math.PI / 2, flip);
      } else { // right
        xLine = g.c + off;
        xText = xLine + fontMm * 0.85;
        pos = placeLabelOutward(
          placed, xText, (g.a + g.b) / 2, text, fontMm, true,
          1, 0, lanePitch, 10, fontMm * 0.35
        );
        xLine = Math.max(xLine, pos.x - fontMm * 0.85);
        ctx.beginPath();
        ctx.moveTo(g.c, g.a); ctx.lineTo(xLine, g.a);
        ctx.moveTo(g.c, g.b); ctx.lineTo(xLine, g.b);
        ctx.stroke();
        drawDimArrowLine(ctx, xLine, g.a, xLine, g.b, tick * 0.7);
        drawDimLabel(ctx, text, pos.x, pos.y, -Math.PI / 2, flip);
      }
    }
  }

  drawGroup(groups.top, "top");
  drawGroup(groups.bottom, "bottom");
  drawGroup(groups.left, "left");
  drawGroup(groups.right, "right");
}

function drawBoardSizeAnnotations(ctx, flip) {
  if (pcbDimMode == "none") return;
  var box = getBoardDimBox();
  if (!box) return;
  var w = box.maxx - box.minx;
  var h = box.maxy - box.miny;
  if (!(w > 0) || !(h > 0)) return;

  var gap = Math.max(3.5, Math.min(w, h) * 0.1);
  var tick = Math.max(1.2, gap * 0.3);
  var fontMm = Math.max(1.35, Math.min(w, h) * 0.034);
  flip = !!flip;

  var style = getComputedStyle(topmostdiv);
  var color = style.getPropertyValue("--fabrication-text-color") || "#a27c24";
  ctx.save();
  ctx.strokeStyle = color;
  ctx.fillStyle = color;
  ctx.lineWidth = Math.max(0.15, Math.min(w, h) * 0.003);
  ctx.lineCap = "round";
  ctx.font = fontMm + "px Verdana, sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  var placed = [];

  // Overall bounding size — outermost lane
  var yDim = box.maxy + gap * 1.35;
  var overallWText = formatDimValue(w);
  var wPos = placeLabelOutward(
    placed, (box.minx + box.maxx) / 2, yDim + fontMm * 0.9,
    overallWText, fontMm, false, 0, 1, fontMm * 1.4, 6, fontMm * 0.3
  );
  ctx.beginPath();
  ctx.moveTo(box.minx, box.maxy);
  ctx.lineTo(box.minx, yDim);
  ctx.moveTo(box.maxx, box.maxy);
  ctx.lineTo(box.maxx, yDim);
  ctx.stroke();
  drawDimArrowLine(ctx, box.minx, yDim, box.maxx, yDim, tick);
  drawDimLabel(ctx, overallWText, wPos.x, wPos.y, 0, flip);

  var xDim = box.minx - gap * 1.35;
  var overallHText = formatDimValue(h);
  var hPos = placeLabelOutward(
    placed, xDim - fontMm * 0.9, (box.miny + box.maxy) / 2,
    overallHText, fontMm, true, -1, 0, fontMm * 1.4, 6, fontMm * 0.3
  );
  ctx.beginPath();
  ctx.moveTo(box.minx, box.miny);
  ctx.lineTo(xDim, box.miny);
  ctx.moveTo(box.minx, box.maxy);
  ctx.lineTo(xDim, box.maxy);
  ctx.stroke();
  drawDimArrowLine(ctx, xDim, box.miny, xDim, box.maxy, tick);
  drawDimLabel(ctx, overallHText, hPos.x, hPos.y, -Math.PI / 2, flip);

  var edges = flattenBoardEdges(pcbdata.edges);
  // Detail dims first (inner lanes), then radii — both use shared collision set
  drawIrregularSegmentAnnotations(ctx, edges, box, flip, gap, tick, fontMm * 0.9, placed);
  drawCornerRadiusAnnotations(ctx, edges, box, flip, fontMm * 0.85, gap, placed);

  ctx.restore();
}

function drawPcbDimensions(layerdict) {
  if (!layerdict || pcbDimMode == "none") return;
  if (!layerdict.fab) return;
  var flip = (layerdict.layer == "B");
  drawBoardSizeAnnotations(layerdict.fab.getContext("2d"), flip);
}

function getStoredCheckboxRefs(checkbox) {
  function convert(ref) {
    var intref = parseInt(ref);
    if (isNaN(intref)) {
      for (var i = 0; i < pcbdata.footprints.length; i++) {
        if (pcbdata.footprints[i].ref == ref) {
          return i;
        }
      }
      return -1;
    } else {
      return intref;
    }
  }
  if (!(checkbox in settings.checkboxStoredRefs)) {
    var val = readStorage("checkbox_" + checkbox);
    settings.checkboxStoredRefs[checkbox] = val ? val : "";
  }
  if (!settings.checkboxStoredRefs[checkbox]) {
    return new Set();
  } else {
    return new Set(settings.checkboxStoredRefs[checkbox].split(",").map(r => convert(r)).filter(a => a >= 0));
  }
}

function getCheckboxState(checkbox, references) {
  var storedRefsSet = getStoredCheckboxRefs(checkbox);
  var currentRefsSet = new Set(references.map(r => r[1]));
  // Get difference of current - stored
  var difference = new Set(currentRefsSet);
  for (ref of storedRefsSet) {
    difference.delete(ref);
  }
  if (difference.size == 0) {
    // All the current refs are stored
    return "checked";
  } else if (difference.size == currentRefsSet.size) {
    // None of the current refs are stored
    return "unchecked";
  } else {
    // Some of the refs are stored
    return "indeterminate";
  }
}

function setBomCheckboxState(checkbox, element, references) {
  var state = getCheckboxState(checkbox, references);
  element.checked = (state == "checked");
  element.indeterminate = (state == "indeterminate");
}

function createCheckboxChangeHandler(checkbox, references, row) {
  return function() {
    refsSet = getStoredCheckboxRefs(checkbox);
    var darkenWhenChecked = settings.darkenWhenChecked == checkbox;
    eventArgs = {
      checkbox: checkbox,
      refs: references,
    }
    if (this.checked) {
      // checkbox ticked
      for (var ref of references) {
        refsSet.add(ref[1]);
      }
      if (darkenWhenChecked) {
        row.classList.add("checked");
      }
      eventArgs.state = 'checked';
    } else {
      // checkbox unticked
      for (var ref of references) {
        refsSet.delete(ref[1]);
      }
      if (darkenWhenChecked) {
        row.classList.remove("checked");
      }
      eventArgs.state = 'unchecked';
    }
    settings.checkboxStoredRefs[checkbox] = [...refsSet].join(",");
    writeStorage("checkbox_" + checkbox, settings.checkboxStoredRefs[checkbox]);
    updateCheckboxStats(checkbox);
    EventHandler.emitEvent(IBOM_EVENT_TYPES.CHECKBOX_CHANGE_EVENT, eventArgs);
  }
}

function createRowHighlightHandler(rowid, refs, net) {

      IBOM_EVENT_TYPES.HIGHLIGHT_EVENT,

      });
